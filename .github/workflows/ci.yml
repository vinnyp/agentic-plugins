name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run agent-dispatch test suites
        shell: bash
        run: bash agent-dispatch/bin/run-tests.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin marketplace
        shell: bash
        run: |
          set +e
          claude plugin validate . 2>&1 | tee claude-plugin-validate.out
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq 'warning|Validation passed with warnings' claude-plugin-validate.out; then
            echo "claude plugin validate emitted warnings; treating as failure."
            exit 1
          fi
          exit "$status"

      # `claude plugin validate .` above only validates the marketplace manifest
      # (.claude-plugin/marketplace.json) — it does NOT descend into each plugin's
      # agents/skills frontmatter. Validate each plugin directory individually so a
      # broken agent/skill file (bad YAML frontmatter, missing required fields,
      # malformed plugin.json) fails CI. Verified locally: a corrupted agent
      # frontmatter is invisible to the marketplace-root validate but is caught here.
      - name: Validate each plugin (claude plugin validate)
        shell: bash
        run: |
          set +e
          status=0
          for plugin in agent-dispatch operator-agents peer-reviewer-agents; do
            echo "::group::claude plugin validate $plugin"
            claude plugin validate "$plugin" 2>&1 | tee "claude-plugin-validate-${plugin}.out"
            plugin_status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$plugin_status" -ne 0 ]; then
              echo "claude plugin validate failed for $plugin (exit $plugin_status)"
              status=1
            fi
            if grep -Eiq 'warning|Validation passed with warnings' "claude-plugin-validate-${plugin}.out"; then
              echo "claude plugin validate emitted warnings for $plugin; treating as failure."
              status=1
            fi
          done
          exit "$status"

      # The agy count assertion below proves a FILE count, not that an agent
      # LOADS. Verified by mutation: adding a `tools:` key to an agent's
      # frontmatter keeps `claude plugin validate` green AND keeps agy's
      # "N processed" count unchanged, while `agy agent` silently drops the
      # agent — the exact trap the dual-runtime frontmatter exists to avoid.
      # A duplicated `name:` is likewise invisible to both. These checks are
      # deterministic, offline, and need neither agy nor credentials.
      - name: Agent frontmatter contract (no tools key, name integrity)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          names_file="$(mktemp)"
          for f in peer-reviewer-agents/agents/*.md operator-agents/agents/*.md; do
            base="$(basename "$f" .md)"
            fm="$(awk '/^---$/{c++; next} c==1' "$f")"
            if printf '%s\n' "$fm" | grep -Eq '^tools:'; then
              echo "$f: forbidden 'tools:' key — silently excludes the agent under agy"
              fail=1
            fi
            name="$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | head -1 | tr -d '"'"'"'"'"'"'"'"'")"
            if [ -z "$name" ]; then
              echo "$f: missing 'name:' in frontmatter"
              fail=1
            elif [ "$name" != "$base" ]; then
              echo "$f: name '$name' does not match filename '$base'"
              fail=1
            fi
            printf '%s\n' "$name" >> "$names_file"
          done
          dupes="$(sort "$names_file" | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "duplicate agent names (one silently shadows the other): $dupes"
            fail=1
          fi
          # Every peer-*-reviewer named in the published dispatch docs must resolve
          # to a real agent, so a roster/doc rename cannot strand a dispatcher.
          for n in $(grep -ohE 'peer-[a-z-]+-reviewer' README.md peer-reviewer-agents/README.md \
              agent-dispatch/skills/running-the-peer-review-gate/references/peer-review-tiers.md \
              | sort -u); do
            grep -qx "$n" "$names_file" || { echo "docs reference '$n', which no agent defines"; fail=1; }
          done
          # Per-plugin lens count published in the plugin README.
          lenses="$(find peer-reviewer-agents/agents -name '*.md' | wc -l | tr -d ' ')"
          tr '\n' ' ' < peer-reviewer-agents/README.md | tr -s ' ' | grep -Fq "All ${lenses} lenses" \
            || { echo "peer-reviewer-agents/README.md lens count != ${lenses}"; fail=1; }
          [ "$fail" -eq 0 ] && echo "agent frontmatter contract OK (${lenses} lenses)"
          exit "$fail"

      # Antigravity CLI (agy) has no npm/brew package — its only public install path
      # is this Google-hosted install script, which is non-interactive and needs no
      # auth (verified: `agy plugin validate` runs clean against a scratch $HOME with
      # no credentials configured). It also self-updates / has no version-pin flag,
      # so this step always installs whatever is currently "latest" — see the open
      # risk noted in the PR/commit for version-drift on runners.
      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: agy --version
        run: agy --version

      # `agy plugin validate` is advisory, not a hard gate: empirically (verified
      # locally) it exits 0 even on invalid JSON in plugin.json, missing required
      # frontmatter fields, and unparseable YAML frontmatter — it never fails on
      # content defects. The one signal it DOES reliably reflect is the per-type
      # "processed" count, which drops when an agent/skill file silently stops being
      # picked up (e.g. moved out of agents/, excluded by a manifest change). So the
      # real regression gate here is the count assertion below, not agy's exit code.
      - name: Validate plugins (agy plugin validate)
        shell: bash
        run: |
          set -e
          strip_ansi() { sed -E 's/\x1b\[[0-9;]*m//g'; }

          echo "::group::agy plugin validate agent-dispatch"
          timeout 60 agy plugin validate agent-dispatch 2>&1 | strip_ansi | tee agy-agent-dispatch.out
          echo "::endgroup::"
          # The skills "N processed" count is NOT environment-stable: agy 1.1.22
          # reported 1 locally (macOS) and 5 on the Linux runner for identical
          # content — one counts skill dirs, the other counts non-evals .md files.
          # So assert only that skills are processed at all (nonzero). The agent
          # counts below ARE stable: agents/ dirs are flat (one .md per agent), so
          # both counting modes agree.
          grep -Eq 'skills[[:space:]]*:[[:space:]]*[1-9][0-9]* processed' agy-agent-dispatch.out \
            || { echo "agy: expected agent-dispatch skills line with a nonzero processed count, got:"; cat agy-agent-dispatch.out; exit 1; }

          echo "::group::agy plugin validate operator-agents"
          timeout 60 agy plugin validate operator-agents 2>&1 | strip_ansi | tee agy-operator-agents.out
          echo "::endgroup::"
          grep -Eq 'agents[[:space:]]*:[[:space:]]*8 processed' agy-operator-agents.out \
            || { echo "agy: expected operator-agents agents count == 8, got:"; cat agy-operator-agents.out; exit 1; }

          echo "::group::agy plugin validate peer-reviewer-agents"
          timeout 60 agy plugin validate peer-reviewer-agents 2>&1 | strip_ansi | tee agy-peer-reviewer-agents.out
          echo "::endgroup::"
          grep -Eq 'agents[[:space:]]*:[[:space:]]*19 processed' agy-peer-reviewer-agents.out \
            || { echo "agy: expected peer-reviewer-agents agents count == 19, got:"; cat agy-peer-reviewer-agents.out; exit 1; }

          # The per-plugin counts above are asserted against agy's own output; the
          # AGGREGATE in README.md has no such gate and silently drifted once (it
          # still said 22 after a lens was added). Derive it and assert the prose.
          total=$(( $(ls peer-reviewer-agents/agents/*.md | wc -l) + $(ls operator-agents/agents/*.md | wc -l) ))
          # tr collapses newlines first: the phrase may wrap across lines.
          tr '\n' ' ' < README.md | tr -s ' ' | grep -Fq "All ${total} agents" \
            || { echo "README.md aggregate agent count != ${total}"; grep -n 'agents across the two' README.md; exit 1; }

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (dir scan, mirrors the publish gate)
        run: gitleaks dir --no-banner --redact --gitleaks-ignore-path .gitleaksignore .

      - name: Shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          files=$(git ls-files '*.sh'; git grep -lE '^#!/usr/bin/env bash|^#!/bin/bash' -- . ':!*.sh' ':!*.md' 2>/dev/null || true)
          echo "$files" | sort -u | sed '/^$/d' | xargs -r shellcheck --severity=warning
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Write commitlint config
        run: |
          echo "module.exports = { extends: ['@commitlint/config-conventional'] };" > commitlint.config.cjs

      - name: Commitlint pull request
        if: github.event_name == 'pull_request'
        run: commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

      - name: Commitlint push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          sha='${{ github.sha }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ] || ! git merge-base --is-ancestor "$before" "$sha" 2>/dev/null; then
            git fetch -q origin main 2>/dev/null || true
            base="$(git merge-base origin/main "$sha" 2>/dev/null || echo "$sha~1")"
            echo "commitlint: before is zero or not an ancestor (force-push/new branch); linting $base..$sha"
            commitlint --from "$base" --to "$sha" --verbose
          else
            commitlint --from "$before" --to "$sha" --verbose
          fi

  go-review-gate:
    name: Go (review-gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-dispatch/tools/review-gate
    env:
      # Fail loud on a version mismatch instead of silently fetching a toolchain.
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Pinned to the go.mod directive; bump both together.
          go-version: '1.26'
          # No third-party deps (stdlib-only, no go.sum), so module caching buys nothing.
          cache: false

      - name: Build, vet and test
        run: |
          set -euo pipefail
          go version
          go build ./...
          go vet ./...
          go test ./...
