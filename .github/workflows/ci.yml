name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin marketplace
        shell: bash
        run: |
          set +e
          claude plugin validate . 2>&1 | tee claude-plugin-validate.out
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq 'warning|Validation passed with warnings' claude-plugin-validate.out; then
            echo "claude plugin validate emitted warnings; treating as failure."
            exit 1
          fi
          exit "$status"

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (dir scan, mirrors the publish gate)
        run: gitleaks dir --no-banner --redact --gitleaks-ignore-path .gitleaksignore .

      - name: Shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          files=$(git ls-files '*.sh'; git grep -lE '^#!/usr/bin/env bash|^#!/bin/bash' -- . ':!*.sh' ':!*.md' 2>/dev/null || true)
          echo "$files" | sort -u | sed '/^$/d' | xargs -r shellcheck --severity=warning
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      - name: Write commitlint config
        run: |
          echo "module.exports = { extends: ['@commitlint/config-conventional'] };" > commitlint.config.cjs

      - name: Commitlint pull request
        if: github.event_name == 'pull_request'
        run: commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

      - name: Commitlint push
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose
