name: CI

on:
  push:
  pull_request:
    # `edited` is NOT in the default set ([opened, synchronize, reopened]) and is
    # load-bearing here: the "prospective squash message" step below lints the PR
    # title and body, which are edited independently of any commit. Without
    # `edited`, a body changed after the check last ran leaves a green required
    # check sitting above text nobody linted — the same "nobody is forced to call
    # it" shape this check replaces (vinnyp/foundry#202).
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run agent-dispatch test suites
        shell: bash
        run: bash agent-dispatch/bin/run-tests.sh

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin marketplace
        shell: bash
        run: |
          set +e
          claude plugin validate . 2>&1 | tee claude-plugin-validate.out
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eiq 'warning|Validation passed with warnings' claude-plugin-validate.out; then
            echo "claude plugin validate emitted warnings; treating as failure."
            exit 1
          fi
          exit "$status"

      # `claude plugin validate .` above only validates the marketplace manifest
      # (.claude-plugin/marketplace.json) — it does NOT descend into each plugin's
      # agents/skills frontmatter. Validate each plugin directory individually so a
      # broken agent/skill file (bad YAML frontmatter, missing required fields,
      # malformed plugin.json) fails CI. Verified locally: a corrupted agent
      # frontmatter is invisible to the marketplace-root validate but is caught here.
      - name: Validate each plugin (claude plugin validate)
        shell: bash
        run: |
          set +e
          status=0
          for plugin in agent-dispatch operator-agents peer-reviewer-agents; do
            echo "::group::claude plugin validate $plugin"
            claude plugin validate "$plugin" 2>&1 | tee "claude-plugin-validate-${plugin}.out"
            plugin_status=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ "$plugin_status" -ne 0 ]; then
              echo "claude plugin validate failed for $plugin (exit $plugin_status)"
              status=1
            fi
            if grep -Eiq 'warning|Validation passed with warnings' "claude-plugin-validate-${plugin}.out"; then
              echo "claude plugin validate emitted warnings for $plugin; treating as failure."
              status=1
            fi
          done
          exit "$status"

      # The agy count assertion below proves a FILE count, not that an agent
      # LOADS. Verified by mutation: adding a `tools:` key to an agent's
      # frontmatter keeps `claude plugin validate` green AND keeps agy's
      # "N processed" count unchanged, while `agy agent` silently drops the
      # agent — the exact trap the dual-runtime frontmatter exists to avoid.
      # A duplicated `name:` is likewise invisible to both. These checks are
      # deterministic, offline, and need neither agy nor credentials.
      - name: Agent frontmatter contract (no tools key, name integrity)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          names_file="$(mktemp)"
          for f in peer-reviewer-agents/agents/*.md operator-agents/agents/*.md; do
            base="$(basename "$f" .md)"
            fm="$(awk '/^---$/{c++; next} c==1' "$f")"
            if printf '%s\n' "$fm" | grep -Eq '^tools:'; then
              echo "$f: forbidden 'tools:' key — silently excludes the agent under agy"
              fail=1
            fi
            name="$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | head -1 | tr -d '"'"'"'"'"'"'"'"'")"
            if [ -z "$name" ]; then
              echo "$f: missing 'name:' in frontmatter"
              fail=1
            elif [ "$name" != "$base" ]; then
              echo "$f: name '$name' does not match filename '$base'"
              fail=1
            fi
            printf '%s\n' "$name" >> "$names_file"
          done
          dupes="$(sort "$names_file" | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "duplicate agent names (one silently shadows the other): $dupes"
            fail=1
          fi
          # Every peer-*-reviewer named in the published dispatch docs must resolve
          # to a real agent, so a roster/doc rename cannot strand a dispatcher.
          # The skills are in scope too: they dispatch lenses BY NAME, and a skill
          # that names a lens no agent defines dispatches nothing.
          for n in $(grep -ohE 'peer-[a-z-]+-reviewer' README.md peer-reviewer-agents/README.md \
              agent-dispatch/skills/running-the-peer-review-gate/references/peer-review-tiers.md \
              operator-agents/skills/*/SKILL.md operator-agents/skills/*/references/*.md \
              | sort -u); do
            grep -qx "$n" "$names_file" || { echo "docs reference '$n', which no agent defines"; fail=1; }
          done
          # Per-plugin lens count published in the plugin README.
          lenses="$(find peer-reviewer-agents/agents -name '*.md' | wc -l | tr -d ' ')"
          tr '\n' ' ' < peer-reviewer-agents/README.md | tr -s ' ' | grep -Fq "All ${lenses} lenses" \
            || { echo "peer-reviewer-agents/README.md lens count != ${lenses}"; fail=1; }
          [ "$fail" -eq 0 ] && echo "agent frontmatter contract OK (${lenses} lenses)"
          exit "$fail"

      # Neither `claude plugin validate` above nor the agy "N processed" assertions
      # below can see a skill that is ABSENT. Verified by mutation: deleting the
      # whole of operator-agents/skills/writing-agent-prds left every other gate in
      # this workflow green — the agy skills assertion is nonzero-only and the two
      # surviving skills already satisfied it, and nothing else in CI reads
      # skills/ at all. This step is the one that sees a missing skill, a skill
      # whose frontmatter name has drifted from its directory (which makes it
      # unaddressable), and a template or reference a SKILL.md points at that is no
      # longer on disk. It is filesystem-derived — it enumerates
      # operator-agents/skills/*/ rather than carrying a list — deterministic, and
      # offline (jq is preinstalled on the runner image). Mutation-verified in a
      # copy of the tree: delete the skill dir -> RED; change the frontmatter name
      # -> RED; delete one asset -> RED; unmutated -> GREEN.
      - name: Skill contract (roster, frontmatter name, link resolution)
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          roster_file="$(mktemp)"
          count=0
          for d in operator-agents/skills/*/; do
            [ -d "$d" ] || continue
            count=$((count + 1))
            base="$(basename "$d")"
            skill="${d}SKILL.md"
            if [ ! -s "$skill" ]; then
              echo "$d: missing or empty SKILL.md — the directory ships but nothing loads it"
              fail=1
              continue
            fi
            fm="$(awk '/^---$/{c++; next} c==1' "$skill")"
            name="$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | head -1 | tr -d '"'"'"'"'"'"'"'"'")"
            if [ -z "$name" ]; then
              echo "$skill: missing 'name:' in frontmatter"
              fail=1
            elif [ "$name" != "$base" ]; then
              echo "$skill: name '$name' does not match directory '$base'"
              fail=1
            fi
            printf '%s\n' "$base" >> "$roster_file"
            # Every assets/ or references/ markdown file a SKILL.md names must exist on
            # disk — both the markdown-link and the backticked form these skills use.
            # A deleted template or reference is then a RED here rather than a dangling
            # pointer the reader discovers at runtime.
            refs="$(grep -ohE '(assets|references)/[A-Za-z0-9._-]+\.md' "$skill" | sort -u || true)"
            for r in $refs; do
              [ -e "${d}${r}" ] || { echo "$skill: names '$r', which does not exist"; fail=1; }
            done
            # Any other relative markdown link must resolve too.
            links="$(grep -ohE '\]\([^) ]+\.md\)' "$skill" | sed -E 's/^\]\(//; s/\)$//' | grep -v '^[a-z][a-z0-9+.-]*:' | sort -u || true)"
            for l in $links; do
              [ -e "${d}${l}" ] || { echo "$skill: link target '$l' does not resolve"; fail=1; }
            done
          done
          if [ "$count" -eq 0 ]; then
            echo "no skill directories under operator-agents/skills/ — an empty enumeration is NOT-RUN, not a pass"
            exit 1
          fi
          # Pin the roster to the published prose, so a deleted or renamed skill is a DIFF
          # rather than a silent drop: the derived count drives the spelled number in
          # README.md and in the plugin description, and every skill on disk must be named
          # in both. Same derivation as the agent aggregate above, which drifted once.
          case "$count" in
            1) word=one ;; 2) word=two ;; 3) word=three ;; 4) word=four ;;
            5) word=five ;; 6) word=six ;; 7) word=seven ;; 8) word=eight ;;
            *) echo "skill count $count has no spelled form here — extend this case"; fail=1; word='__unspelled__' ;;
          esac
          # tr collapses newlines first: the phrase may wrap across lines.
          readme_flat="$(tr '\n' ' ' < README.md | tr -s ' ')"
          printf '%s' "$readme_flat" | grep -Fq "${word} authoring skills" \
            || { echo "README.md authoring-skill count != ${count}: expected the phrase '${word} authoring skills'. On-disk roster: $(tr '\n' ' ' < "$roster_file")"; fail=1; }
          # The operator-agents description is carried in three manifests and must be
          # byte-identical in all three: the marketplace entry, the agy plugin.json, and
          # the Claude .claude-plugin/plugin.json.
          desc_marketplace="$(jq -er '.plugins[] | select(.name == "operator-agents") | .description' .claude-plugin/marketplace.json)"
          desc_agy="$(jq -er '.description' operator-agents/plugin.json)"
          desc_claude="$(jq -er '.description' operator-agents/.claude-plugin/plugin.json)"
          if [ "$desc_marketplace" != "$desc_agy" ] || [ "$desc_marketplace" != "$desc_claude" ]; then
            echo "the three operator-agents descriptions are not byte-identical:"
            printf '  .claude-plugin/marketplace.json: %s\n' "$desc_marketplace"
            printf '  operator-agents/plugin.json:     %s\n' "$desc_agy"
            printf '  operator-agents/.claude-plugin:  %s\n' "$desc_claude"
            fail=1
          fi
          printf '%s' "$desc_marketplace" | grep -Fq "${word} authoring skills" \
            || { echo "operator-agents description authoring-skill count != ${count}: expected '${word} authoring skills'. On-disk roster: $(tr '\n' ' ' < "$roster_file")"; fail=1; }
          while read -r s; do
            printf '%s' "$readme_flat" | grep -Fq "$s" \
              || { echo "README.md names no skill '$s'"; fail=1; }
            printf '%s' "$desc_marketplace" | grep -Fq "$s" \
              || { echo "operator-agents description names no skill '$s'"; fail=1; }
          done < "$roster_file"
          [ "$fail" -eq 0 ] && echo "skill contract OK (${count} skills: $(tr '\n' ' ' < "$roster_file"))"
          exit "$fail"

      # Antigravity CLI (agy) has no npm/brew package — its only public install path
      # is this Google-hosted install script, which is non-interactive and needs no
      # auth (verified: `agy plugin validate` runs clean against a scratch $HOME with
      # no credentials configured). It also self-updates / has no version-pin flag,
      # so this step always installs whatever is currently "latest" — see the open
      # risk noted in the PR/commit for version-drift on runners.
      - name: Install Antigravity CLI (agy)
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: agy --version
        run: agy --version

      # `agy plugin validate` is advisory, not a hard gate: empirically (verified
      # locally) it exits 0 even on invalid JSON in plugin.json, missing required
      # frontmatter fields, and unparseable YAML frontmatter — it never fails on
      # content defects. The one signal it DOES reliably reflect is the per-type
      # "processed" count, which drops when an agent/skill file silently stops being
      # picked up (e.g. moved out of agents/, excluded by a manifest change). So the
      # real regression gate here is the count assertion below, not agy's exit code.
      - name: Validate plugins (agy plugin validate)
        shell: bash
        run: |
          set -e
          strip_ansi() { sed -E 's/\x1b\[[0-9;]*m//g'; }

          echo "::group::agy plugin validate agent-dispatch"
          timeout 60 agy plugin validate agent-dispatch 2>&1 | strip_ansi | tee agy-agent-dispatch.out
          echo "::endgroup::"
          # The skills "N processed" count is NOT environment-stable: agy 1.1.22
          # reported 1 locally (macOS) and 5 on the Linux runner for identical
          # content — one counts skill dirs, the other counts non-evals .md files.
          # So assert only that skills are processed at all (nonzero). The agent
          # counts below ARE stable: agents/ dirs are flat (one .md per agent), so
          # both counting modes agree.
          grep -Eq 'skills[[:space:]]*:[[:space:]]*[1-9][0-9]* processed' agy-agent-dispatch.out \
            || { echo "agy: expected agent-dispatch skills line with a nonzero processed count, got:"; cat agy-agent-dispatch.out; exit 1; }

          echo "::group::agy plugin validate operator-agents"
          timeout 60 agy plugin validate operator-agents 2>&1 | strip_ansi | tee agy-operator-agents.out
          echo "::endgroup::"
          grep -Eq 'agents[[:space:]]*:[[:space:]]*8 processed' agy-operator-agents.out \
            || { echo "agy: expected operator-agents agents count == 8, got:"; cat agy-operator-agents.out; exit 1; }
          # operator-agents ships three skills; assert they're processed at all
          # (nonzero) so a silently-unloaded skill fails CI instead of shipping
          # invisible, same rationale as agent-dispatch above. Nonzero is all this
          # can assert — the count is not environment-stable (see above) — so the
          # per-skill roster gate is the "Skill contract" step earlier in this job.
          grep -Eq 'skills[[:space:]]*:[[:space:]]*[1-9][0-9]* processed' agy-operator-agents.out \
            || { echo "agy: expected operator-agents skills line with a nonzero processed count, got:"; cat agy-operator-agents.out; exit 1; }

          echo "::group::agy plugin validate peer-reviewer-agents"
          timeout 60 agy plugin validate peer-reviewer-agents 2>&1 | strip_ansi | tee agy-peer-reviewer-agents.out
          echo "::endgroup::"
          grep -Eq 'agents[[:space:]]*:[[:space:]]*19 processed' agy-peer-reviewer-agents.out \
            || { echo "agy: expected peer-reviewer-agents agents count == 19, got:"; cat agy-peer-reviewer-agents.out; exit 1; }

          # The per-plugin counts above are asserted against agy's own output; the
          # AGGREGATE in README.md has no such gate and silently drifted once (it
          # still said 22 after a lens was added). Derive it and assert the prose.
          total=$(( $(ls peer-reviewer-agents/agents/*.md | wc -l) + $(ls operator-agents/agents/*.md | wc -l) ))
          # tr collapses newlines first: the phrase may wrap across lines.
          tr '\n' ' ' < README.md | tr -s ' ' | grep -Fq "All ${total} agents" \
            || { echo "README.md aggregate agent count != ${total}"; grep -n 'agents across the two' README.md; exit 1; }

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks (dir scan, mirrors the publish gate)
        run: gitleaks dir --no-banner --redact --gitleaks-ignore-path .gitleaksignore .

      - name: Shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          files=$(git ls-files '*.sh'; git grep -lE '^#!/usr/bin/env bash|^#!/bin/bash' -- . ':!*.sh' ':!*.md' 2>/dev/null || true)
          echo "$files" | sort -u | sed '/^$/d' | xargs -r shellcheck --severity=warning
      - name: Install commitlint
        run: npm install -g @commitlint/cli @commitlint/config-conventional

      # The rules now live in the checked-in commitlint.config.cjs at the repo
      # root, which commitlint discovers from the working directory. CI used to
      # write that file inline here, so the rules existed only inside this step
      # and agent-dispatch/bin/wrap-merge-body.sh had nothing to read.

      # This is the step that makes the goal true. The commitlint runs below lint
      # the BRANCH's commits; on a squash merge none of them become the commit
      # that lands — GitHub composes that from the PR title and body, which were
      # linted by nothing and cannot be rewritten once pushed to public main.
      # `3957b55` (164/349/184/365/341-character body lines) and `0f8f7c2`
      # (200/119/121) each left a failing push run on main for exactly that
      # reason. Linting the prospective squash message catches it while the body
      # is still editable.
      - name: Commitlint the prospective squash message
        if: github.event_name == 'pull_request'
        env:
          # Through the environment, never interpolated into the shell: a body
          # beginning with `-`, or containing `$(...)` or a backtick, is data.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          msg="$(mktemp)"
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$msg"
          commitlint --edit "$msg" --verbose

      - name: Commitlint pull request
        if: github.event_name == 'pull_request'
        run: commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose

      - name: Commitlint push
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          sha='${{ github.sha }}'
          if [ "$before" = '0000000000000000000000000000000000000000' ] || ! git merge-base --is-ancestor "$before" "$sha" 2>/dev/null; then
            git fetch -q origin main 2>/dev/null || true
            base="$(git merge-base origin/main "$sha" 2>/dev/null || echo "$sha~1")"
            echo "commitlint: before is zero or not an ancestor (force-push/new branch); linting $base..$sha"
            commitlint --from "$base" --to "$sha" --verbose
          else
            commitlint --from "$before" --to "$sha" --verbose
          fi

  go-review-gate:
    name: Go (review-gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-dispatch/tools/review-gate
    env:
      # Fail loud on a version mismatch instead of silently fetching a toolchain.
      GOTOOLCHAIN: local
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Pinned to the go.mod directive; bump both together.
          go-version: '1.26'
          # No third-party deps (stdlib-only, no go.sum), so module caching buys nothing.
          cache: false

      - name: Build, vet and test
        run: |
          set -euo pipefail
          go version
          go build ./...
          go vet ./...
          go test ./...
